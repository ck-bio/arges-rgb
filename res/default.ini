; Arges RGB settings. Save, and changes apply on your next key press.
;
; Any setting can go in [general] or in a profile. The profile's own value wins,
; then [general], then the built-in value.
;
;   group        submenu the profile sits in on the tray menu
;   description  a line about the profile, shown beside its name in the settings window
;
; Static, the light between key presses
;   static_effect  off, still, breathe (slowly brightens and dims), heartbeat (a steady double pulse), ember (wavers like a coal), beacon (a short pulse every few seconds), sparks (random
;                flashes over the first colour), rainbow (blends through the colours, or round the rainbow from one colour), aurora (drifts
;                unevenly through them)
;   static_colour  (Colours) red,green,blue (0-255), 0,0,0 = black. Several separated by ; are used by the effect:
;                still takes turns, one per key press; breathe, heartbeat, ember and beacon go from the first colour
;                at their brightest to the last at their dimmest (orange;red makes a fire); sparks fly in the
;                others on the first; rainbow and aurora blend through them all.
;   static_shuffle  (Random order) 1 = still takes its colours in random order, never the same twice running
;   static_speed 1-10, how fast the effect moves, 5 = medium
;   static_strength  0-100, how far a breath or pulse dims, how much an ember wavers, how bright a spark is,
;                how far an aurora drifts. At 0, several colours still move without dimming.
;                Effects that move keep Arges updating the keyboard between key presses.
;   static_brightness  0-100, how bright the light between key presses is in percent, 100 = as the colours say
;   Only in this file:
;   static_seasons  Static by season instead: spring;summer;autumn;winter
;                (northern hemisphere, spring is March to May). Two colours split the year in half.
;
; Reactive, the flash on each key press
;   reactive_effect  off (no flash), flash (each press flashes the next colour), rainbow (each press moves a step
;                through the colours, blending between them, or round the rainbow from one colour) speed (slow
;                typing flashes the first colour, fast typing the last; with one colour, fast typing flashes whiter)
;                or heartbeat (beats in the colours while you type, faster as you type faster, for 2 s after
;                the last key; a longer duration beats slower, and echo does nothing)
;   reactive_colour  (Colours) red,green,blue (0-255). Several separated by ; take turns, one per key press.
;   reactive_shuffle  (Random order) 1 = key presses take the colours in random order, never the same twice running
;   reactive_afterglow  (Afterglow) up to 3 colours every flash passes through as it fades back to Static,
;                empty = none
;   reactive_brightness  0-100, how bright the flash and its afterglow are in percent, 100 = as the colours say
;   reactive_duration  (Duration) how long the flash takes to fade out, in milliseconds. With heartbeat, how long
;                each beat takes to fade, so a longer one beats slower.
;   reactive_echo  (Echo) how many times the flash plays again after each key press (0-4), 0 = none
;   reactive_echo_strength  (Echo strength) 1-100, how bright each echo is in percent, 100 = as bright as the
;                flash (echo 1 at 100 is a lightning flicker)
;   reactive_hold  1 = the flash stays lit while a key is held down, and fades when it is let go (the default),
;                0 = it fades straight away
;   Only in this file:
;   reactive_fade_in  how long the flash takes to light up, in milliseconds, 0 = at once
;   reactive_curve  1 = fades at an even rate, 2-5 = drops quickly at first, then trails off
;
; Schedule and lights
;   schedule     [general] only: up to 4 stretches from-to:what, separated by ;. From the first hour up to the
;                second (24h clock, 0-23, past midnight too), dim the profile in use (dim), switch to a random profile
;                (random), turn the lights off (off) or switch to a profile by name. The first one that covers the
;                hour wins. Empty = none.
;                Example: schedule=1-7:dim;18-1:Hephaestus
;   dim          (Dim brightness) brightness during dim hours, and while Dim is ticked on the tray menu, in
;                percent, 0 = off
;   random       [general] only: 1 = a new random profile when Arges starts and every hour. Set from the tray menu
;                (Random profile); picking a profile turns it off.
;   off_after    [general] only: lights off after this many minutes without typing, 0 = never
;   off_with_screen  [general] only: 1 = lights off while the screen is off (the default), 0 = leave them on
;   fps          (Frame rate) updates per second while the light fades or moves, smoother up to about 60

[general]
profile=Zeus
fps=45
schedule=0-7:dim
dim=10
reactive_duration=200
reactive_colour=0,0,0
reactive_effect=off
static_effect=off

